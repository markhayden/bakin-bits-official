name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the version-bump check diffs against the PR base.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Package version bump check
        if: github.event_name == 'pull_request'
        run: ./scripts/check-version-bump.sh "origin/${{ github.base_ref }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install build-only SDK
        run: cd .build-sdk && bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build prebuilt plugin artifacts
        run: bun run build

      # dist/ is build output (no longer committed). The build above is a
      # compile check; artifacts are produced + published by publish.yml on a
      # `<id>-v<semver>` tag, not committed to the repo.

      - name: Tests with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ui:
    name: Official plugin UI conformance
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --init --ipc=host
    permissions:
      contents: read
    steps:
      - name: Checkout official Bits
        uses: actions/checkout@v6

      - name: Checkout compatible Bakin SDK source
        uses: actions/checkout@v6
        with:
          repository: markhayden/bakin
          ref: main
          path: .bakin-source

      # The playwright container image ships without unzip, which setup-bun
      # needs to extract the bun archive.
      - name: Install unzip for setup-bun
        run: apt-get update && apt-get install -y unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Bakin SDK build dependencies
        working-directory: .bakin-source
        run: bun install --frozen-lockfile

      # bakin's stylesheet build scans ../bakin-bits-official relative to its
      # repo root, and the SDK assembly asserts the compiled candidate is
      # byte-identical to bakin's committed canonical (built WITH these plugin
      # sources). The bakin checkout lives at .bakin-source inside THIS repo,
      # so expose the Bits checkout at the sibling path the glob expects.
      - name: Expose Bits at bakin's sibling path
        run: ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/bakin-bits-official"

      - name: Assemble the compatible SDK
        working-directory: .bakin-source
        run: bun run scripts/publish-sdk.ts --dry-run --version 0.1.1-rc.1 --package-dir "$RUNNER_TEMP/sdk-package" --keep-package-dir

      - name: Run official plugin UI conformance
        env:
          BAKIN_SDK_PACKAGE_DIR: ${{ runner.temp }}/sdk-package
        run: bun run ui:conformance

      - name: Upload plugin UI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: official-plugin-ui-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: test-results/plugin-ui-conformance
